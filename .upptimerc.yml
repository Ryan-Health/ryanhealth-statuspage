# Ryan Health status page (Upptime)
owner: ryan-health
repo: ryanhealth-statuspage

sites:
  - name: Ryan Health Website
    url: https://ryanhealth.org/
  - name: Web EMR
    url: https://nywrchapp.ecwcloud.com/mobiledoc/jsp/webemr/login/newLogin.jsp

# Check every 15 minutes to conserve GitHub Actions minutes on a private repo
workflowSchedule:
  uptime: "*/15 * * * *"

status-website:
  # No custom domain yet: site is served at ryan-health.github.io/ryanhealth-statuspage
  baseUrl: /ryanhealth-statuspage
  name: Ryan Health Status
  introTitle: "**Ryan Health** service status"
  introMessage: Current status of our public website and web EMR.
  navbar:
    - title: Status
      href: /
    - title: Microsoft 365 Status
      href: https://status.cloud.microsoft/
    - title: TeamSense Status
      href: https://status.teamsense.com/

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
